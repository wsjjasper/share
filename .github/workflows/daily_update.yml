name: A-Share Sentiment Daily Auto-Update

on:
  schedule:
    # 交易日每天自动触发 3 次：
    # 1. 北京时间 16:00 (UTC 08:00): 收盘后第一时间抓取大盘收盘与行情
    # 2. 北京时间 20:00 (UTC 12:00): 官方两融数据发布后二次精准校准
    # 3. 北京时间 23:00 (UTC 15:00): 夜间最终核验
    - cron: '0 8,12,15 * * 1-5'
  workflow_dispatch: # 支持在 GitHub 网页端随时手动一键触发

permissions:
  contents: write

jobs:
  update-sentiment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system Chinese fonts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-wqy-microhei fonts-noto-cjk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy akshare requests matplotlib openpyxl

      - name: Configure Git Author
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run automated data fetch & sentiment pipeline
        run: |
          python update.py

      - name: Push updates to repository branches
        run: |
          git push origin main || echo "Main branch already up to date"
          git push origin main:master || echo "Master branch already up to date"
