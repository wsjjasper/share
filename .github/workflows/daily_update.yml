name: A-Share Sentiment Daily Auto-Update

on:
  schedule:
    # 每个交易日北京时间 20:00 (UTC 12:00) 自动执行
    - cron: '0 12 * * 1-5'
  workflow_dispatch: # 支持在 GitHub 网页端随时手动一键触发

permissions:
  contents: write

jobs:
  update-sentiment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system Chinese fonts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-wqy-microhei fonts-noto-cjk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy akshare requests matplotlib openpyxl

      - name: Configure Git Author
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run automated data fetch & sentiment pipeline
        run: |
          python update.py

      - name: Push updates to repository branches
        run: |
          git push origin main || echo "Main branch already up to date"
          git push origin main:master || echo "Master branch already up to date"
